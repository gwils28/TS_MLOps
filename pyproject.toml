[project]
name = "w47"
version = "0.1.0"
description = "W47 - label-free monitoring of a demand forecaster (NannyML DLE vs realized error, NYC TLC hourly trips)"
readme = "README.md"
authors = [{ name = "Wilson Goma" }]
requires-python = ">=3.11"
dependencies = [
    "holidays>=0.109",
    "kaleido==0.2.1",
    "lightgbm>=4.5.0",
    "matplotlib>=3.11.2",
    "nannyml>=0.13.1",
    "pandas>=2.2,<3",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project.scripts]
w47 = "w47.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
